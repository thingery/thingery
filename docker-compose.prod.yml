# Production stack: Postgres (pgvector) + Thingery app + Caddy (automatic HTTPS).
# See docs/deploy-vps.md for the full runbook.
#   cp .env.example .env  (edit values)  then:  docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thingery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thingery}
    volumes:
      - thingery_pgdata:/var/lib/postgresql/data
    # Never exposed publicly; reachable only on the compose network as "db".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thingery}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      # Baked into the image and surfaced on /healthz + site footer (THI-68).
      # Export before `up -d --build`, e.g.
      #   export GIT_COMMIT=$(git rev-parse HEAD) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    # Overlay-network pin for outbound triage calls (deploy-vps.md §5.4):
    # containers do not inherit the host /etc/hosts, so an operator whose
    # REPORT_REVIEW_CREATE_URL host lives on a private overlay (e.g. a
    # Tailscale tailnet) pins "hostname:ip" in the VPS .env. Unset → a
    # no-op loopback pin. Value is a hostname+ip, never a secret.
    extra_hosts:
      - "${REPORT_REVIEW_HOST_PIN:-localhost:127.0.0.1}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thingery}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thingery}
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://thingery.dev}
      EMBED_API_URL: ${EMBED_API_URL:-https://api.openai.com/v1/embeddings}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      # Chat assistant (docs/security.md §6 H2.3). Empty LLM_API_KEY keeps chat
      # dark (503); MCP and signup are unaffected. Key value lives only in the
      # VPS .env, never in this repo.
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # Bring-your-own LLM keys (spec THI-186 Phase 1 / THI-189): dedicated
      # AES-256-GCM master key for stored seller credentials (openssl rand
      # -hex 32). Unset → BYO disabled server-wide (fail closed). Lives only
      # in the VPS .env, never in this repo.
      LLM_CREDENTIALS_MASTER_KEY: ${LLM_CREDENTIALS_MASTER_KEY:-}
      LLM_BYO_ALLOWED_MODELS: ${LLM_BYO_ALLOWED_MODELS:-}
      # G1: opt-in for local/loopback endpoints (dev). Off in prod by default.
      LLM_BYO_ALLOW_LOCAL_ENDPOINTS: ${LLM_BYO_ALLOW_LOCAL_ENDPOINTS:-}
      # Sign in with ChatGPT (spec THI-193 / THI-211): feature flag + client id
      # gate it (empty/unset ⇒ off: /api/me/chatgpt routes 404, no UI).
      # REDIRECT_URI default derives from PUBLIC_BASE_URL; values live only in
      # the VPS .env, never in this repo.
      CHATGPT_OAUTH_ENABLED: ${CHATGPT_OAUTH_ENABLED:-}
      CHATGPT_OAUTH_CLIENT_ID: ${CHATGPT_OAUTH_CLIENT_ID:-}
      CHATGPT_OAUTH_CLIENT_SECRET: ${CHATGPT_OAUTH_CLIENT_SECRET:-}
      CHATGPT_OAUTH_REDIRECT_URI: ${CHATGPT_OAUTH_REDIRECT_URI:-}
      CHATGPT_OAUTH_DEFAULT_MODEL: ${CHATGPT_OAUTH_DEFAULT_MODEL:-}
      # OpenAI plugin directory domain verification (THI-296 AC1):
      # GET /.well-known/openai-apps-challenge serves this exact token
      # (503 while unset). Value lives only in the VPS .env.
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      # Order flow — Stripe Connect (THI-358). Passthrough only: values live
      # in the VPS .env. All five default empty = kill switch (payments off,
      # order tools answer payments_not_configured). STRIPE_WEBHOOK_SECRET is
      # required before the Stripe webhook endpoint leaves its 503 stub;
      # STRIPE_WEBHOOK_SECRET_PREVIOUS enables zero-downtime secret rotation.
      # STRIPE_CONNECT_WEBHOOK_SECRET (+_PREVIOUS) is the 'Connected
      # accounts'-scoped endpoint's secret (THI-1611 A1): without it,
      # account.updated deliveries 400 and sellers never become payout-ready.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_PREVIOUS: ${STRIPE_WEBHOOK_SECRET_PREVIOUS:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS: ${STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS:-}
      # Order flow — EasyPost carrier automation (THI-572). Passthrough only:
      # values live in the VPS .env. Empty/unset EASYPOST_API_KEY = degraded
      # mode (no trackers, buy_shipping_label answers easypost_not_configured,
      # carrier webhook stays a 503 stub). EASYPOST_WEBHOOK_SECRET is required
      # before the carrier webhook endpoint verifies deliveries;
      # EASYPOST_WEBHOOK_SECRET_PREVIOUS enables zero-downtime secret rotation.
      # LABEL_* are the label spend gates (label-purchase spec THI-566: defaults
      # in code, max €30/label + €200/day); LABEL_DAILY_BUDGET_CENTS=0 is the
      # instant spend kill switch (restart to apply).
      EASYPOST_API_KEY: ${EASYPOST_API_KEY:-}
      EASYPOST_WEBHOOK_SECRET: ${EASYPOST_WEBHOOK_SECRET:-}
      EASYPOST_WEBHOOK_SECRET_PREVIOUS: ${EASYPOST_WEBHOOK_SECRET_PREVIOUS:-}
      # Shipping provider selection + Shippo (THI-1248). Passthrough only:
      # values live in the VPS .env. Empty/unset SHIPPING_PROVIDER keeps the
      # code default ("easypost"); "shippo" switches labels, tracking, carrier
      # webhooks and address verification to Shippo. Only the selected
      # provider's keys are read. SHIPPO_WEBHOOK_SECRET is required before the
      # carrier webhook endpoint verifies deliveries;
      # SHIPPO_WEBHOOK_SECRET_PREVIOUS enables zero-downtime secret rotation.
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-}
      SHIPPO_API_KEY: ${SHIPPO_API_KEY:-}
      SHIPPO_WEBHOOK_SECRET: ${SHIPPO_WEBHOOK_SECRET:-}
      SHIPPO_WEBHOOK_SECRET_PREVIOUS: ${SHIPPO_WEBHOOK_SECRET_PREVIOUS:-}
      # Address verification — Sendcloud v3 (ships dark: empty/unset keeps the
      # advisory check degraded, i.e. not_checked). SENDCLOUD_API_KEY is the
      # basic-auth credential ("key:secret" pair, or a single token as the
      # basic username); SENDCLOUD_VALIDATE_CARRIER_CODE must name a carrier
      # available on the account — both required to activate. Passthrough
      # only: values live in the VPS .env.
      SENDCLOUD_API_KEY: ${SENDCLOUD_API_KEY:-}
      SENDCLOUD_VALIDATE_CARRIER_CODE: ${SENDCLOUD_VALIDATE_CARRIER_CODE:-}
      LABEL_MAX_COST_CENTS: ${LABEL_MAX_COST_CENTS:-}
      LABEL_DAILY_BUDGET_CENTS: ${LABEL_DAILY_BUDGET_CENTS:-}
      # Notifications — in-app store + Resend transactional email (THI-760
      # Phase 0-1, enablement THI-779). NOTIFY_EMAIL_ENABLED=false keeps email
      # dark (in-app notifications only, code default). Flag on with an empty
      # RESEND_API_KEY degrades fail-closed (dry-run + boot error, never an
      # open send path — src/mailer.ts). Values live in the VPS .env only.
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_FROM_ADDRESS: ${NOTIFY_FROM_ADDRESS:-}
      NOTIFY_PUBLIC_BASE_URL: ${NOTIFY_PUBLIC_BASE_URL:-}
      # Resend bounce webhook + operator alerts (THI-760 Phase 2,
      # enablement THI-1048). Passthrough only: values live in the VPS
      # .env, never in this repo. RESEND_WEBHOOK_SECRET unset →
      # /api/webhooks/resend stays a fail-closed 503 stub
      # (src/webhooks-resend.ts); set it to the exact secret configured
      # on the Resend dashboard webhook endpoint. RESEND_WEBHOOK_SECRET_PREVIOUS
      # (optional, THI-1537) accepts the prior secret during a rotation
      # window — zero-downtime rotation, same pattern as
      # STRIPE_WEBHOOK_SECRET_PREVIOUS; unset ⇒ single-secret behavior.
      # OPERATOR_ALERT_EMAIL unset ⇒ dead-letter/sweep anomaly alerts stay
      # log-only (src/notify/operator.ts plans nothing without an address).
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_WEBHOOK_SECRET_PREVIOUS: ${RESEND_WEBHOOK_SECRET_PREVIOUS:-}
      OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:-}
      # Item-report alias email (THI-1451, THI-1479 plan Phase C).
      # Passthrough only: value lives in the VPS .env, never in this repo.
      # Unset ⇒ report emails stay log-only (src/notify/operator.ts plans
      # nothing without an address — the same dark default as
      # OPERATOR_ALERT_EMAIL, so self-hosted deployments never mail the
      # Thingery project alias). Thingery's own deployment sets
      # report@thingery.dev.
      REPORT_ALERT_EMAIL: ${REPORT_ALERT_EMAIL:-}
      # Item report review triage (THI-788 step 3, activation THI-802).
      # Passthrough only: values live in the VPS .env. The seam stays
      # disabled unless BOTH REPORT_REVIEW_CREATE_URL and
      # REPORT_REVIEW_API_TOKEN are set (src/report-review-notify.ts:
      # best-effort notify after a report INSERT; failure leaves
      # reports.board_issue_ref NULL and never fails the user's report).
      # The token value lives only in the VPS .env, never in this repo.
      REPORT_REVIEW_CREATE_URL: ${REPORT_REVIEW_CREATE_URL:-}
      REPORT_REVIEW_API_TOKEN: ${REPORT_REVIEW_API_TOKEN:-}
      REPORT_REVIEW_ASSIGNEE_ID: ${REPORT_REVIEW_ASSIGNEE_ID:-}
      REPORT_REVIEW_ITEM_URL_TEMPLATE: ${REPORT_REVIEW_ITEM_URL_TEMPLATE:-}
      # Per-attempt budget (ms) for the triage POST (THI-1066). Delivery
      # runs off the report request path, so a slow triage endpoint cannot
      # stall user reports — raise it to ride out control-plane load spikes
      # (measured ~30s under load). Empty/invalid falls back to the code
      # default (5000); clamped to [100, 600000].
      REPORT_REVIEW_TIMEOUT_MS: ${REPORT_REVIEW_TIMEOUT_MS:-}
      # Backfill staleness window in hours (THI-1068, spec §backfill):
      # open reports with NULL board_issue_ref older than this are skipped
      # terminally instead of retried. Empty/invalid falls back to the code
      # default (48); clamped to [1, 168] — above 168 h the tracker's
      # idempotency-key retention (7 days) can no longer absorb a replay.
      REPORT_REVIEW_MAX_AGE_HOURS: ${REPORT_REVIEW_MAX_AGE_HOURS:-}
      # Session cookie signing (login/consent). Unset → ephemeral secret,
      # sessions reset on every restart.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # OAuth kill switch (spec THI-11 §4.4): "1"/"true" mounts no /oauth route at
      # all (404) and thgo_ tokens 401. Empty → OAuth enabled. Restart to toggle.
      OAUTH_DISABLED: ${OAUTH_DISABLED:-}
      # OAuth tuning (defaults match .env.example / src).
      OAUTH_DCR_HOURLY_LIMIT: ${OAUTH_DCR_HOURLY_LIMIT:-10}
      OAUTH_ACCESS_TTL_S: ${OAUTH_ACCESS_TTL_S:-1800}
      OAUTH_REFRESH_TTL_S: ${OAUTH_REFRESH_TTL_S:-2592000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded item images survive redeploys
      - uploads:/app/uploads
    # THI-312: keep stdout/stderr (security events, startup) on disk. THI-1330:
    # the app writes to the host's persistent systemd journal instead of the
    # json-file driver, because json-file is per-container and every deploy
    # recreate (new container ID) starts an empty log — wiping the window that
    # log-based watches and forensics need. Journal entries survive container
    # recreation; `docker logs` still works for the running container. The
    # stable `tag` gives `journalctl -t thingery-app` a query path that is
    # invariant across deploys. Rotation is the journal's own vacuum (see
    # docs/deploy-vps.md §7). db/caddy keep json-file (unchanged blast radius).
    logging:
      driver: journald
      options:
        tag: "thingery-app"
    # Internal only; Caddy terminates TLS and proxies to it.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Your domain. Keep PUBLIC_BASE_URL in step with it.
      SITE_DOMAIN: ${SITE_DOMAIN:-thingery.dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    # THI-312: the Caddy access log (Caddyfile `log`) goes to stderr; keep it
    # on disk across container restarts, bounded by rotation (docs/deploy-vps.md §7).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  thingery_pgdata:
  caddy_data:
  caddy_config:
  uploads:
