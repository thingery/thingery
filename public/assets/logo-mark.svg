<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Thingery logo">
  <!-- Thingery logo (THI-356): a white "T" on a green rounded square.
       Recreated as clean vector geometry from the board-approved badge in the
       hero illustration (website/assets/hero-brand.webp). Green #019686 is
       sampled from that source; T proportions match the original mark.
       Scale reference: bar 43% of width, T spans 27%–80% of height. -->
  <rect width="128" height="128" rx="26" fill="#019686"/>
  <rect x="36.5" y="35" width="55" height="18" rx="3.5" fill="#ffffff"/>
  <rect x="55" y="44" width="18" height="58" rx="3.5" fill="#ffffff"/>
</svg>
