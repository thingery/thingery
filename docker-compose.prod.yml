# Production stack: Postgres (pgvector) + Thingery app + Caddy (automatic HTTPS).
# See docs/deploy-vps.md for the full runbook.
#   cp .env.example .env  (edit values)  then:  docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thingery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thingery}
    volumes:
      - thingery_pgdata:/var/lib/postgresql/data
    # Never exposed publicly; reachable only on the compose network as "db".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thingery}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      # Baked into the image and surfaced on /healthz + site footer (THI-68).
      # Export before `up -d --build`, e.g.
      #   export GIT_COMMIT=$(git rev-parse HEAD) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thingery}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thingery}
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://thingery.dev}
      EMBED_API_URL: ${EMBED_API_URL:-https://api.openai.com/v1/embeddings}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      # Chat assistant (docs/security.md §6 H2.3). Empty LLM_API_KEY keeps chat
      # dark (503); MCP and signup are unaffected. Key value lives only in the
      # VPS .env, never in this repo.
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # Bring-your-own LLM keys (spec THI-186 Phase 1 / THI-189): dedicated
      # AES-256-GCM master key for stored seller credentials (openssl rand
      # -hex 32). Unset → BYO disabled server-wide (fail closed). Lives only
      # in the VPS .env, never in this repo.
      LLM_CREDENTIALS_MASTER_KEY: ${LLM_CREDENTIALS_MASTER_KEY:-}
      LLM_BYO_ALLOWED_MODELS: ${LLM_BYO_ALLOWED_MODELS:-}
      # G1: opt-in for local/loopback endpoints (dev). Off in prod by default.
      LLM_BYO_ALLOW_LOCAL_ENDPOINTS: ${LLM_BYO_ALLOW_LOCAL_ENDPOINTS:-}
      # Sign in with ChatGPT (spec THI-193 / THI-211): feature flag + client id
      # gate it (empty/unset ⇒ off: /api/me/chatgpt routes 404, no UI).
      # REDIRECT_URI default derives from PUBLIC_BASE_URL; values live only in
      # the VPS .env, never in this repo.
      CHATGPT_OAUTH_ENABLED: ${CHATGPT_OAUTH_ENABLED:-}
      CHATGPT_OAUTH_CLIENT_ID: ${CHATGPT_OAUTH_CLIENT_ID:-}
      CHATGPT_OAUTH_CLIENT_SECRET: ${CHATGPT_OAUTH_CLIENT_SECRET:-}
      CHATGPT_OAUTH_REDIRECT_URI: ${CHATGPT_OAUTH_REDIRECT_URI:-}
      CHATGPT_OAUTH_DEFAULT_MODEL: ${CHATGPT_OAUTH_DEFAULT_MODEL:-}
      # OpenAI plugin directory domain verification (THI-296 AC1):
      # GET /.well-known/openai-apps-challenge serves this exact token
      # (503 while unset). Value lives only in the VPS .env.
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      # Session cookie signing (login/consent). Unset → ephemeral secret,
      # sessions reset on every restart.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # OAuth kill switch (spec THI-11 §4.4): "1"/"true" mounts no /oauth route at
      # all (404) and thgo_ tokens 401. Empty → OAuth enabled. Restart to toggle.
      OAUTH_DISABLED: ${OAUTH_DISABLED:-}
      # OAuth tuning (defaults match .env.example / src).
      OAUTH_DCR_HOURLY_LIMIT: ${OAUTH_DCR_HOURLY_LIMIT:-10}
      OAUTH_ACCESS_TTL_S: ${OAUTH_ACCESS_TTL_S:-1800}
      OAUTH_REFRESH_TTL_S: ${OAUTH_REFRESH_TTL_S:-2592000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded item images survive redeploys
      - uploads:/app/uploads
    # THI-312: keep stdout/stderr (security events, startup) on disk across
    # container restarts, bounded by rotation. See docs/deploy-vps.md §7.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Internal only; Caddy terminates TLS and proxies to it.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    # THI-312: the Caddy access log (Caddyfile `log`) goes to stderr; keep it
    # on disk across container restarts, bounded by rotation (docs/deploy-vps.md §7).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  thingery_pgdata:
  caddy_data:
  caddy_config:
  uploads:
