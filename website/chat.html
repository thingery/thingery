<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Thingery</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" href="/assets/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:title" content="Chat — Thingery">
  <meta property="og:description" content="Thingery is the open item database and MCP server for AI agents to list, find, and trade second-hand goods.">
  <meta property="og:site_name" content="Thingery">
  <meta property="og:url" content="https://thingery.dev/chat.html">
  <meta property="og:image" content="https://thingery.dev/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://thingery.dev/assets/og-image.png">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100dvh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
    }
    header {
      padding: .8rem 1.2rem; border-bottom: 1px solid rgba(127,127,127,.3);
      display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header h1 .logo { display: inline-flex; align-items: center; gap: .5rem;
      font-weight: 750; text-decoration: none; color: inherit; }
    header h1 .logo .logo-mark { display: block; height: 24px; width: auto; }
    header .links { font-size: .9rem; }
    a { color: inherit; }
    #log { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
    .msg { max-width: 44rem; margin: .4rem auto; padding: .6rem .9rem; border-radius: 12px; white-space: pre-wrap; }
    .user { background: rgba(127,127,127,.18); }
    .bot { background: rgba(127,127,127,.08); }
    .sys { text-align: center; opacity: .7; font-size: .85rem; }
    .msg.confirm { background: rgba(127,127,127,.12); border: 1px solid rgba(127,127,127,.4); }
    .confirm-q { font-weight: 600; }
    .confirm-actions { display: flex; gap: .5rem; margin-top: .5rem; }
    .confirm-actions button { padding: .45rem .9rem; font-size: .9rem; }
    form { display: flex; gap: .5rem; padding: .8rem 1.2rem; border-top: 1px solid rgba(127,127,127,.3); }
    input { flex: 1; padding: .7rem .8rem; font: inherit; border-radius: 10px;
      border: 1px solid rgba(127,127,127,.5); background: transparent; color: inherit; }
    button { padding: .7rem 1.2rem; font: inherit; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(127,127,127,.5); background: rgba(127,127,127,.15); color: inherit; }
    button:disabled { opacity: .5; cursor: wait; }
    #plan-indicator { font-size: .8rem; opacity: .75; padding: .25rem 1.2rem .1rem; border-top: 1px solid rgba(127,127,127,.3); }
    #plan-indicator img { width: .95rem; height: .95rem; vertical-align: -0.15rem; }
  </style>
</head>
<body>
  <header>
    <h1><a class="logo" href="/"><img class="logo-mark" src="/assets/logo-mark.svg" alt="" width="26" height="24">Thingery</a> assistant</h1>
    <span class="links" id="account-link"><a href="/login.html">Log in / sign up</a></span>
  </header>

  <div id="log">
    <div class="msg bot">Hi! Tell me what you'd like to sell — a few words and I'll turn it into a listing.
Or ask me to find something used. <em>(Searching works without an account; publishing needs one.)</em></div>
  </div>

  <!-- THI-193 §3.6 + OpenAI UX guidelines: while the turn runs on the
       user's ChatGPT plan, show "Using ChatGPT plan" with a Manage usage
       link near the composer. chat.js reveals it when the status endpoint
       reports a connected plan; hidden otherwise (flag off = no element). -->
  <div id="plan-indicator" hidden>
    <img src="/assets/chatgpt-logo-white.svg" alt="" width="21" height="21"> Using ChatGPT plan ·
    <a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Manage usage</a>
  </div>

  <form id="chat-form">
    <input id="message" placeholder="e.g. Sell my Diplomat fountain pen, good condition, 120 euros" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script src="/chat.js"></script>
</body>
</html>
