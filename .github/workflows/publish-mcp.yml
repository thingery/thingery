name: Publish to npm and MCP Registry

# Triggers on version tags (v0.1.0, ...):
#   1. tests + build, then npm publish (requires the NPM_TOKEN secret)
#   2. publishes server.json to the official MCP registry via GitHub OIDC (no secrets)
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # THI-226: NPM_TOKEN lives only in the protected `npm` environment
    # (deployment-branch policy: TAG-typed rule `v*` only — branch-typed rules
    # do not cover tag refs, and tag refs need a tag-typed rule to be allowed
    # at all). Unreviewed refs (branches, non-v* tags, stray workflow_dispatch)
    # cannot resolve the token: the job is blocked before any step runs.
    environment: npm
    permissions:
      id-token: write # OIDC for the MCP registry
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret is empty"; exit 1; fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm publish --access public

      - name: Wait for npm propagation
        run: sleep 90

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
