name: no-private-paths

# Repo-boundary guardrails (THI-565, THI-1619):
#   1. no-private-paths — company-private material must never land in the
#      public repo (thingery/thingery holds the open-source core only; the
#      company side lives in thingery/platform). Fails any PR that adds or
#      modifies deny-listed paths. CODEOWNERS cannot express "must not
#      exist"; a path check can. Deny-list from the THI-573 proposal (§5):
#      apps/ deploy/ billing/ ops/ website/ — active now (prophylactic);
#      website/ retired by #237 (→ public/), denied so it can never return.
#   2. tracked-tree-guard — git stores a symlink as a 120000-mode file blob,
#      so workspace symlinks bypass directory-only .gitignore forms; twice a
#      node_modules symlink rode a PR via `git add -A` (69cf21e, #402).
#      Fails any PR that tracks a symlink blob or a node_modules path, and
#      any main push whose full tree contains one (catches direct pushes and
#      admin merges that bypass the PR gate). Symlink targets are additionally
#      scanned for internal-topology leaks (defense in depth).
#   3. committed merge-conflict markers (THI-1659) — a botched resolution
#      landed a literal marker on main-bound docs and passed every gate
#      (THI-1649 A6). Fails any PR that adds a marker line, and any main
#      push (plus a weekly full-tree pass, same cadence as the weekly
#      content-marker scan) whose tracked files contain one. Allowlist for
#      legitimate markers lives in check-tracked-tree.sh (CONFLICT_ALLOWLIST).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1" # Mondays 04:47 UTC — weekly full-tree pass (THI-1659)

permissions:
  contents: read

jobs:
  no-private-paths:
    # PR-only: the path deny-list needs github.base_ref; main pushes are
    # covered by tracked-tree-guard below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the merge-base with the base branch
      - name: Deny company-private paths (THI-565)
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          deny=("apps/" "deploy/" "billing/" "ops/" "website/")
          rc=0
          while IFS= read -r f; do
            for d in "${deny[@]}"; do
              if [[ "$f" == "$d"* ]]; then
                echo "::error file=${f}::company-private path '${d}**' must not live in the public repo (THI-565)"
                rc=1
              fi
            done
          done < <(git diff --name-only --diff-filter=ACMRT "$base"...HEAD)
          if [[ $rc -ne 0 ]]; then
            echo "This pull request touches company-private paths."
            echo "Company-side work (website, apps, deploy, billing, ops) belongs in thingery/platform (THI-565)."
          fi
          exit $rc

  tracked-tree-guard:
    name: Tracked-tree guard (symlinks / node_modules / topology / conflict markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base diff on PRs; full tree on pushes + weekly pass
      - name: Scan PR diff for symlinks, node_modules, and added conflict markers
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-tracked-tree.sh pr origin/main
      - name: Full-tree scan for symlinks, node_modules, and conflict markers
        if: github.event_name != 'pull_request' # push to main + weekly pass
        run: bash .github/scripts/check-tracked-tree.sh tree
