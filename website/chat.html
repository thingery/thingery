<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="chat.title">Chat — Thingery</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" href="/assets/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:title" content="Chat — Thingery">
  <meta property="og:description" content="Thingery is the open item database and MCP server for AI agents to list, find, and trade second-hand goods.">
  <meta property="og:site_name" content="Thingery">
  <meta property="og:url" content="https://thingery.dev/chat.html">
  <meta property="og:image" content="https://thingery.dev/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://thingery.dev/assets/og-image.png">
  <style>
    /* THI-278: chat page restyled on the site design system (website/index.html
       tokens) — same palette, radii and type scale as the landing page. */
    :root {
      color-scheme: light dark;
      --ink: #1a1d23;
      --muted: #5c6470;
      --line: rgba(127,127,127,.22);
      --card: rgba(127,127,127,.07);
      --accent: #0f7b6c;
      --accent-2: #b7791f;
      --user-bubble: #0f7b6c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8eaee; --muted: #9aa3af; --card: rgba(127,127,127,.1); --accent: #2dd4bf; --accent-2: #f6c177; --user-bubble: #134e48; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100dvh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6; color: var(--ink); background:
      radial-gradient(1100px 420px at 12% -8%, rgba(15,123,108,.10), transparent 60%),
      radial-gradient(800px 360px at 92% 0%, rgba(183,121,31,.08), transparent 55%);
    }
    header {
      padding: .8rem 1.2rem; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      background: rgba(127,127,127,.04);
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
    header h1 .logo { display: inline-flex; align-items: center; gap: .5rem;
      font-weight: 750; text-decoration: none; color: inherit; }
    header h1 .logo .logo-mark { display: block; height: 24px; width: auto; }
    header .links { font-size: .88rem; color: var(--muted); text-align: right; }
    header .links a { color: inherit; text-decoration: none; }
    header .links a:hover { color: var(--ink); }
    a { color: var(--accent); }

    #log { flex: 1; overflow-y: auto; padding: 1.4rem 1rem 1rem; }
    .col { max-width: 46rem; margin-inline: auto; display: flex; flex-direction: column; gap: .7rem; }
    .msg { max-width: min(44rem, 88%); padding: .65rem .95rem; border-radius: 16px;
      white-space: pre-wrap; overflow-wrap: break-word; font-size: .96rem; }
    .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line);
      border-bottom-left-radius: 5px; }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff;
      border-bottom-right-radius: 5px; }
    .msg.sys { text-align: center; opacity: .7; font-size: .85rem; }
    .msg.confirm { align-self: center; max-width: 36rem; background: var(--card);
      border: 1px solid var(--accent-2); border-radius: 14px; padding: .9rem 1.1rem; }
    .confirm-q { font-weight: 600; }
    .confirm-actions { display: flex; gap: .5rem; margin-top: .6rem; }
    .confirm-actions button { padding: .45rem .9rem; font-size: .9rem; }

    /* THI-278: thinking indicator + letter-by-letter reveal. The caret is a
       ::after so the revealed text stays one clean run, and both animations
       are disabled for prefers-reduced-motion users (text then lands instantly). */
    .msg.typing { padding: .7rem 1rem; }
    .msg.typing .dots { display: inline-block; letter-spacing: .25em; color: var(--muted); }
    .msg.revealing .reveal::after { content: "▍"; margin-left: 1px; color: var(--accent);
      animation: caret-blink 1s steps(1) infinite; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @keyframes caret-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .msg.revealing .reveal::after { animation: none; }
      .msg.typing .dots { animation: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .msg.typing .dots { animation: typing-pulse 1.2s ease-in-out infinite; }
    }
    @keyframes typing-pulse { 50% { opacity: .35; } }

    footer { border-top: 1px solid var(--line); background: rgba(127,127,127,.04); }
    #plan-indicator { font-size: .8rem; color: var(--muted); padding: .3rem 1.2rem .15rem;
      max-width: 50rem; margin-inline: auto; width: 100%; }
    #plan-indicator img { width: .95rem; height: .95rem; vertical-align: -0.15rem; }
    form { display: flex; gap: .55rem; padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom));
      max-width: 50rem; margin-inline: auto; width: 100%; }
    input { flex: 1; padding: .7rem .9rem; font: inherit; font-size: 1rem; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input::placeholder { color: var(--muted); opacity: .8; }
    button { padding: .7rem 1.25rem; font: inherit; font-weight: 600; border-radius: 12px; cursor: pointer;
      border: 1px solid transparent; background: var(--accent); color: #fff; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: wait; }
    confirm-actions button { background: var(--card); border-color: var(--line); color: inherit; font-weight: 500; }
    .confirm-actions button:hover { filter: none; background: rgba(127,127,127,.2); }
    /* THI-445: EN/IT toggle in the header, next to the account link. */
    header { flex-wrap: wrap; }
    .head-right { display: inline-flex; align-items: center; gap: .8rem; flex-wrap: wrap; justify-content: flex-end; }
    .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
    .lang-btn { display: inline-flex; align-items: center; gap: .35rem; font: inherit; font-size: .78rem;
      font-weight: 650; letter-spacing: .02em; padding: .32rem .62rem; border: none; background: transparent;
      color: var(--muted); cursor: pointer; }
    .lang-btn:hover { color: var(--ink); }
    .lang-btn .lang-flag { width: 1.15em; height: auto; border-radius: 2px; display: block; }
    .lang-btn[aria-pressed="true"] { background: var(--card); color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n-html="chat.head"><a class="logo" href="/"><img class="logo-mark" src="/assets/logo-mark.svg" alt="" width="24" height="24">Thingery</a> assistant</h1>
    <span class="head-right">
      <div class="lang-switch" data-lang-switch></div>
      <span class="links" id="account-link"><a href="/login.html" data-i18n="chat.login">Log in / sign up</a></span>
    </span>
  </header>

  <div id="log">
    <div class="col" id="col">
      <div class="msg bot" data-i18n-html="chat.welcome">Hi! Tell me what you'd like to sell — a few words and I'll turn it into a listing.
Or ask me to find something used. <em>(Searching works without an account; publishing needs one.)</em></div>
    </div>
  </div>

  <!-- THI-193 §3.6 + OpenAI UX guidelines: while the turn runs on the
       user's ChatGPT plan, show "Using ChatGPT plan" with a Manage usage
       link near the composer. chat.js reveals it when the status endpoint
       reports a connected plan; hidden otherwise (flag off = no element). -->
  <footer>
    <div id="plan-indicator" hidden data-i18n-html="chat.plan">
      <img src="/assets/chatgpt-logo-white.svg" alt="" width="21" height="21"> Using ChatGPT plan ·
      <a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Manage usage</a>
    </div>

    <form id="chat-form">
      <input id="message" placeholder="e.g. Sell my Diplomat fountain pen, good condition, 120 euros" data-i18n-placeholder="chat.placeholder" autocomplete="off" autofocus>
      <button id="send" type="submit" data-i18n="chat.send">Send</button>
    </form>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
